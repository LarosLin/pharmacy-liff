<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>領藥通知綁定</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f7fa;
    }

    .container {
      max-width: 420px;
      margin: 80px auto;
      background: white;
      padding: 40px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 20px;
    }

    #message {
      font-size: 18px;
      line-height: 1.8;
      color: #198754;
      font-weight: bold;
    }

    .loading {
      color: #555;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">💊</div>

    <h1>領藥通知綁定</h1>

    <div id="message" class="loading">
      正在處理，請稍候……
    </div>

  </div>


  <script>

    const LIFF_ID = "2011684298-YNeB7VcL";

    async function main() {

      try {

        // 初始化 LIFF
        await liff.init({
          liffId: LIFF_ID
        });


        // 如果還沒有登入 LINE
        if (!liff.isLoggedIn()) {

          liff.login();

          return;
        }


        // 取得 LINE User ID
        const profile = await liff.getProfile();

        const userId = profile.userId;

        console.log("LINE User ID:", userId);


        // 顯示綁定成功
        document.getElementById("message").innerHTML =
          "✅ 綁定成功！<br><br>" +
          "您已完成領藥通知綁定。";


      } catch (error) {

        console.error(error);

        document.getElementById("message").innerHTML =
          "❌ 綁定失敗<br><br>" +
          "請稍後再試，或聯絡藥局。";

      }

    }


    main();

  </script>

</body>

</html>
