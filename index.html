<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>領藥通知綁定</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 30px;
    }

    #result {
      margin-top: 30px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 12px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>💊 領藥通知綁定</h1>

  <p id="status">正在辨識您的 LINE 帳號……</p>

  <div id="result"></div>

  <script>

    const LIFF_ID = "2011684298-YNeB7VcL";

    async function main() {

      try {

        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();

        document.getElementById("status").innerText =
          "LINE 已成功辨識！";

        document.getElementById("result").innerHTML =
          "<strong>您的 LINE User ID</strong><br><br>" +
          profile.userId;

        console.log("LINE User ID:", profile.userId);

      } catch (error) {

        document.getElementById("status").innerText =
          "辨識失敗";

        document.getElementById("result").innerText =
          error;

        console.error(error);

      }

    }

    main();

  </script>

</body>

</html>
